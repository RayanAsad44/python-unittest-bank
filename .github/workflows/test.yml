name: Run tests

on:
    push:
      branches:
        - CI-In-class-activity

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then install -r requirements.txt; fi

      - name: Run tests
        run: run -m pytest
        
